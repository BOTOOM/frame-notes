  <text x="628" y="574" fill="#88857e" font-family="Arial, sans-serif" font-size="17" letter-spacing="2">LOCAL · EDITABLE · FRAME-ACCURATE</text>
  <rect x="600" y="54" width="548" height="478" rx="16" fill="#302f2b" stroke="#4d4b44" />

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Frame Notes — notas de revisión local para HyperFrames Studio</title>
  <rect width="1200" height="630" fill="#242421" />

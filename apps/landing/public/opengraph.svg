  <image href="logo.svg" x="72" y="82" width="92" height="92" />
  <text x="188" y="145" fill="#f2f0eb" font-family="Arial, sans-serif" font-size="58" font-weight="700">Frame Notes</text>
  <text x="74" y="266" fill="#e6b45d" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">NOTAS LOCALES DE REVISIÓN</text>
  <text x="74" y="330" fill="#f2f0eb" font-family="Arial, sans-serif" font-size="34" font-weight="600">Encuentra el instante.</text>
  <text x="74" y="378" fill="#f2f0eb" font-family="Arial, sans-serif" font-size="34" font-weight="600">Comparte el contexto.</text>
  <text x="74" y="432" fill="#b8b5ae" font-family="Arial, sans-serif" font-size="21">Notas por rango de tiempo y cuadro</text>
